# Task runner for the build and the publishing flow.
#
# Entirely optional. Every task below is one line that calls a script which
# works perfectly well on its own - mise encodes the order and makes the
# pipeline discoverable (`mise tasks`), it is not a dependency of the project.
# Without it, read the run = lines and type them.
#
# First use in a fresh clone needs `mise trust`, which is mise refusing to
# execute a config it has not been told to believe.
#
# There is deliberately no [tools] section. Nothing here needs a pinned
# runtime: every import in tools/ is Python standard library, so any python3
# works and pinning one would make mise install a second interpreter for no
# benefit. The real dependencies - OpenSCAD, and Chrome for the PDF - are
# desktop applications that mise does not manage. `mise run doctor` checks for
# them instead, which is the useful half of dependency management here.

[env]
# Override to point at a different OpenSCAD.
OPENSCAD = "/Applications/OpenSCAD.app/Contents/MacOS/OpenSCAD"

[tasks.doctor]
description = "Check the tools this project actually needs"
run = """
ok=0
if [ -x "$OPENSCAD" ]; then echo "  openscad  $OPENSCAD"
else echo "  openscad  MISSING - brew install --cask openscad, or set OPENSCAD"; ok=1; fi
echo "  python3   $(python3 --version 2>&1)  (standard library only, nothing to install)"
if [ -d "/Applications/Google Chrome.app" ]; then echo "  chrome    present - renders the instructions PDF"
else echo "  chrome    missing - only 'mise run pdf' needs it"; fi
exit $ok
"""

[tasks.build]
description = "Build all 16 plates into print/ and stl/"
run = "./tools/build.sh"

[tasks.check]
description = "Verify every 3MF before it goes anywhere"
run = "./tools/check_3mf.py"

[tasks.pdf]
description = "Render publish/instructions.md to PDF"
run = "python3 tools/make_pdf.py"

[tasks.package]
description = "Zip the model-site uploads into upload/"
run = "python3 tools/make_upload.py"

[tasks.labels]
description = "Open the label maker"
run = "open label-maker/index.html"

[tasks.figures]
description = "Regenerate the rail drawing in images/"
run = "python3 tools/draw_rail_profile.py"

[tasks.clean]
description = "Remove everything the build produces"
run = "rm -rf print stl release upload"

# The whole publishing flow, in the order it has to happen: build, then verify
# what was built, then package only what passed. check_3mf.py exits non-zero on
# a real fault, so a bad plate stops this before it reaches a zip.
#
# These are steps in one task, not `depends`. mise runs dependencies in
# parallel, so listing them there had package and check racing the build and
# failing on a directory that did not exist yet. An array of run lines is
# sequential, and stops at the first non-zero exit.
[tasks.release]
description = "Build, verify, and package everything for upload"
run = [
  "./tools/build.sh --release",
  "./tools/check_3mf.py",
  "python3 tools/make_pdf.py",
  "python3 tools/make_upload.py",
  "echo '  release/ for GitHub, upload/ for Printables and MakerWorld'",
]

[tasks.build-release]
description = "Build with the flat release/ asset names as well"
run = "./tools/build.sh --release"
